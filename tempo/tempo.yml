server:
  http_listen_port: 3200
  log_level: info
  log_format: json

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 100ms

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 168h  # default is 336h

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: railway
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      # - url: "${RAILWAY_PROMETHEUS_ENDPOINT:-http://prometheus:9090/api/v1/write}"
      - url: "${RAILWAY_PROMETHEUS_ENDPOINT}"
        send_exemplars: true

overrides:
  metrics_generator_processors: []
