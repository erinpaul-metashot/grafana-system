global:
  scrape_interval: 15s
  external_labels:
    monitor: 'railway-prometheus'

scrape_configs:
  - job_name: 'local-prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    scrape_interval: 5s
    static_configs:
      - targets: ['${{Otel-Collector.RAILWAY_PRIVATE_DOMAIN}}:8889']

  - job_name: 'tempo'
    scrape_interval: 5s
    static_configs:
      - targets: ['${{Tempo.RAILWAY_PRIVATE_DOMAIN}}:3200']

  - job_name: 'loki'
    scrape_interval: 5s
    static_configs:
      - targets: ['${{Loki.RAILWAY_PRIVATE_DOMAIN}}:3100']

  - job_name: 'opengradhub-backend'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['${{opengradhub-backend.RAILWAY_PRIVATE_DOMAIN}}:4000']

