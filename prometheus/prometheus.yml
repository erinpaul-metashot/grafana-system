global:
  scrape_interval: 30s
  external_labels:
    monitor: 'railway-prometheus'

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector.railway.internal:8889']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'go_.*|otelcol_.*|grpc_.*|process_.*|promhttp_.*'
        action: drop

  - job_name: '${BACKEND_JOB_NAME}'
    metrics_path: /metrics
    static_configs:
      - targets: ['${BACKEND_TARGET}']

