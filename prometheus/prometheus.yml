global:
  scrape_interval: 15s
  external_labels:
    monitor: 'railway-prometheus'

scrape_configs:
  - job_name: 'local-prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    scrape_interval: 5s
    static_configs:
      - targets: ['${PROMETHEUS_OTEL_TARGET:-otel-collector.railway.internal:8889}']

  - job_name: 'tempo'
    scrape_interval: 5s
    static_configs:
      - targets: ['${PROMETHEUS_TEMPO_TARGET:-tempo.railway.internal:3200}']

  - job_name: 'loki'
    scrape_interval: 5s
    static_configs:
      - targets: ['${PROMETHEUS_LOKI_TARGET:-loki.railway.internal:3100}']

  # - job_name: 'jaeger'
  #   scrape_interval: 5s
  #   static_configs:
  #     - targets: ['Jaeger:16686']

  - job_name: 'opengradhub-backend'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      # Note: In Railway, replace 'backend.railway.internal:4000' with your actual 
      # backend service's internal private URL and port.
      - targets: ['${PROMETHEUS_BACKEND_TARGET:-opengradhub-backend.railway.internal:4000}']

